name: CI

on:
  push:
    branches: [main, development, finalizacao-fiesc]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Tipagem
        run: python -m mypy src app scripts tests
      - name: Testes
        run: python -m pytest
      - name: Teste rapido ponta a ponta
        run: python scripts/smoke_test.py
      - name: Verificacao de seguranca
        run: python scripts/security_check.py
      - name: Gerar pacote de entrega
        run: python scripts/package_release.py
      - name: Validar pacote isolado
        run: python scripts/validate_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: codigo-fiesc-02198
          path: output/release/*.zip
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagem
        run: docker build -t fiesc-prescritiva:test .
