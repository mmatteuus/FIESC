[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiesc-manutencao-prescritiva"
version = "1.1.0"
description = "Pipeline auditavel de manutencao prescritiva com classificacao, recuperacao documental e abstencao segura."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dashboard = [
  "altair>=5.4,<7",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]
generative = ["google-genai>=1.0,<2"]
documents = [
  "pillow>=10.4,<13",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
]
dev = [
  "mypy>=1.11,<2",
  "psutil>=6,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["output", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.vercel]
entrypoint = "app_server:app"
